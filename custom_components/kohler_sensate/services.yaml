dispense:
  name: Dispense water
  description: Dispense a measured amount of water from the Sensate faucet.
  fields:
    amount_ml:
      name: Amount (mL)
      description: How much to dispense, in milliliters.
      example: 250
      selector:
        number:
          min: 10
          max: 4000
          step: 10
          unit_of_measurement: mL
          mode: box
    amount_l:
      name: Amount (L)
      description: How much to dispense, in liters (use this OR amount in mL).
      example: 0.5
      selector:
        number:
          min: 0.01
          max: 4
          step: 0.05
          unit_of_measurement: L
          mode: box
