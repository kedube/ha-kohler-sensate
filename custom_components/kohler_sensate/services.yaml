dispense:
  fields:
    device_id:
      required: false
      selector:
        device:
          integration: kohler_sensate
    amount:
      required: false
      example: 250
      selector:
        number:
          min: 0.01
          max: 4000
          step: any
          mode: box
    unit:
      required: false
      example: ml
      selector:
        select:
          translation_key: volume_unit
          options:
            - ml
            - l
            - fl_oz
            - cup
            - qt
            - gal
    amount_ml:
      required: false
      advanced: true
      example: 250
      selector:
        number:
          min: 10
          max: 4000
          step: 10
          unit_of_measurement: mL
          mode: box
    amount_l:
      required: false
      advanced: true
      example: 0.5
      selector:
        number:
          min: 0.01
          max: 4
          step: 0.01
          unit_of_measurement: L
          mode: box
