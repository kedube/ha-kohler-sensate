name: Validate

# CI runs this on every push and pull request. The nightly run catches HACS
# and Home Assistant tightening their checks between commits.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master
