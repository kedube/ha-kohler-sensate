name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v4.1.0
      - run: ruff format --check

  pytest:
    name: Pytest (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Latest Home Assistant.
          - name: latest HA
            harness: pytest-homeassistant-custom-component
          # Minimum supported version, matching hacs.json (HA 2026.3.4).
          - name: HA 2026.3
            harness: pytest-homeassistant-custom-component==0.13.320
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install ${{ matrix.harness }}
      - run: pytest
