name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
      - run: ruff format --check

  pytest:
    name: Pytest (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Latest Home Assistant.
          - name: latest HA
            python: "3.14"
            harness: pytest-homeassistant-custom-component
          # Minimum supported version, matching hacs.json (HA 2025.8.3).
          - name: HA 2025.8
            python: "3.13"
            # HA 2025.8's aiodns needs pycares 4.x.
            harness: pytest-homeassistant-custom-component==0.13.272 pycares==4.11.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install ${{ matrix.harness }}
      - run: pytest
